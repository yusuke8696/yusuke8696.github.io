name: Blogger Sync

on:
  workflow_dispatch:
    inputs:
      article:
        description: "Article path"
        required: true
        default: "articles/local-llm-pc.html"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sync to Blogger
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: |
          python scripts/sync_blogger.py "${{ inputs.article }}"
          
      - name: Save Blogger post mapping
        run: |
          if git diff --quiet blogger-posts.json; then
            echo "No mapping changes"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add blogger-posts.json
          git commit -m "Update Blogger post mapping"
          git push
