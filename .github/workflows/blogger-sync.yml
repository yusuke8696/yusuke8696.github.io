name: Blogger Sync

on:
  push:
    branches: [main]
    paths:
      - 'articles/**/*.html'
      - 'index.html'
      - '_includes/**'
      - '_data/**'
      - '_config.yml'
      - 'assets/**'
      - 'scripts/sync_blogger*.py'
      - '.github/workflows/blogger-sync.yml'
  workflow_dispatch:
    inputs:
      article:
        description: 'Article path (empty = all articles; ignored for pages)'
        required: false
        default: ''
      target:
        description: 'Sync target'
        type: choice
        options: [all, posts, pages]
        default: all

permissions:
  contents: write

# Never cancel an in-flight insert. All runs use the latest saved mappings.
concurrency:
  group: blogger-sync-main
  cancel-in-progress: false

jobs:
  sync:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main including saved IDs
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test sync without credentials
        id: tests
        run: python -m unittest discover -s tests -v

      - name: Build with GitHub Pages Jekyll
        if: github.event_name == 'push' || inputs.target != 'posts'
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Sync Blogger home page
        if: github.event_name == 'push' || inputs.target != 'posts'
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        run: python scripts/sync_blogger_page.py _site/index.html

      - name: Sync articles
        if: ${{ !cancelled() && steps.tests.outcome == 'success' && (github.event_name == 'push' || inputs.target != 'pages') }}
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          ARTICLE: ${{ inputs.article }}
        shell: bash
        run: |
          if [ -n "$ARTICLE" ]; then
            python scripts/sync_blogger.py "$ARTICLE"
          else
            # Reconcile latest main even if GitHub coalesces pending push runs.
            while IFS= read -r -d '' article; do
              python scripts/sync_blogger.py "$article"
            done < <(find articles -type f -name '*.html' -print0)
          fi

      - name: Save Blogger mappings even after partial failure
        if: ${{ always() && !cancelled() }}
        shell: bash
        run: |
          git add blogger-posts.json blogger-pages.json
          if git diff --cached --quiet; then
            echo 'No mapping changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update Blogger ID mappings'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1

      - name: Keep mapping recovery copy
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: blogger-id-mappings
          path: |
            blogger-posts.json
            blogger-pages.json
