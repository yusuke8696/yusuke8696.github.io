name: Create article draft from approved issue

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "承認済み記事Issueの番号"
        required: true
        type: string

permissions:
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: article-from-issue-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  create-draft:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' &&
       github.event.label.name == 'article-approved' &&
       github.event.issue.state == 'open' &&
       github.event.issue.pull_request == null)
    runs-on: ubuntu-latest
    steps:
      - name: Read approved issue
        id: issue
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = Number(context.payload.inputs?.issue_number || context.issue.number);
            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });
            if (!issue.labels.some((label) => (typeof label === 'string' ? label : label.name) === 'article-approved')) {
              core.setFailed('記事を作成するには article-approved ラベルが必要です。');
              return;
            }
            core.setOutput('number', String(issue.number));
            core.setOutput('title', issue.title);
            core.setOutput('body', issue.body || '');

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate article HTML
        env:
          ARTICLE_ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ARTICLE_ISSUE_TITLE: ${{ steps.issue.outputs.title }}
          ARTICLE_ISSUE_BODY: ${{ steps.issue.outputs.body }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL || 'gpt-5.6-luna' }}
        run: node scripts/generate-article.mjs

      - name: Create draft pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: article/issue-${{ steps.issue.outputs.number }}
          delete-branch: true
          commit-message: Add article draft for issue #${{ steps.issue.outputs.number }}
          title: 記事案: ${{ steps.issue.outputs.title }}
          body: |
            Closes #${{ steps.issue.outputs.number }}

            このPull RequestはGitHub Actionsが作成した下書きです。
            マージ前に、事実関係・外部リンク・広告表記・著作権・個人情報を確認してください。
          labels: automated-article
          draft: true
