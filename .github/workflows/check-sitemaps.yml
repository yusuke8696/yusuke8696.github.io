name: Check sitemap

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build with GitHub Pages Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Validate generated sitemap and article coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          ns = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          base = 'https://yusuke8696.github.io/'

          # sitemap.xml に掲載されるべきURL
          expected = {base} | {
              base + p.as_posix()
              for p in Path('articles').rglob('*.html')
          }

          sitemap = Path('_site/sitemap.xml')

          # sitemap.xml が生成されていること
          assert sitemap.exists(), \
              '_site/sitemap.xml was not generated'

          # XMLとして読み込めること
          root = ET.parse(sitemap).getroot()

          assert root.tag == '{%s}urlset' % ns['s'], \
              f'Unexpected root element: {root.tag}'

          # URL一覧を取得
          urls = [
              loc.text
              for loc in root.findall('s:url/s:loc', ns)
          ]

          # URL重複チェック
          assert len(urls) == len(set(urls)), \
              f'Duplicate URLs found: {urls}'

          # トップページ + articles/ の網羅性チェック
          assert set(urls) == expected, (
              'Sitemap URLs do not match expected URLs',
              urls,
              expected,
          )

          # robots.txt の確認
          robots = Path('_site/robots.txt')

          assert robots.exists(), \
              '_site/robots.txt was not generated'

          expected_robots = (
              'Sitemap: ' + base + 'sitemap.xml'
          )

          assert robots.read_text().strip() == expected_robots, (
              robots.read_text(),
              expected_robots,
          )

          # 所有権確認ファイルを確認
          for name in (
              'BingSiteAuth.xml',
              'google5d93088e5855540d.html',
          ):
              source = Path(name)
              generated = Path('_site') / name

              assert generated.exists(), \
                  f'{name} was not preserved'

              assert generated.read_bytes() == source.read_bytes(), \
                  f'{name} changed during build'

          print(
              'sitemap.xml valid; '
              'all articles covered; '
              'verification files preserved.'
          )
          PY

      - name: Validate homepage article links
        run: python3 .github/scripts/check-article-links.py

      - name: Add temporary articles to verify automatic discovery
        run: |
          cat > articles/ci-new-article.html <<'EOF'
          ---
          layout: null
          title: "CI & 新着記事"
          published_date: "2099-01-01"
          ---
          <!doctype html>
          <html lang="ja">
          <title>CI article</title>
          <p>Temporary test article</p>
          </html>
          EOF

          echo '<!doctype html><html><title>Plain article</title></html>' \
            > articles/ci-plain-article.html

      - name: Rebuild with temporary articles
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Verify new articles appear without editing the homepage
        run: python3 .github/scripts/check-article-links.py
