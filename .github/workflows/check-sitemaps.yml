name: Check sitemaps
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with GitHub Pages Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Validate generated XML and article coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ns = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          base = 'https://yusuke8696.github.io/'
          expected = {base} | {base + p.as_posix() for p in Path('articles').rglob('*.html')}
          for name in ('sitemap.xml', 'sitemap_google.xml', 'sitemap_bing.xml'):
              root = ET.parse(Path('_site') / name).getroot()
              assert root.tag == '{%s}urlset' % ns['s']
              urls = [loc.text for loc in root.findall('s:url/s:loc', ns)]
              assert len(urls) == len(set(urls)), urls
              assert set(urls) == expected, (name, urls, expected)
          import datetime
          import json
          dates = json.loads(Path('_data/sitemap_dates.json').read_text())
          google = ET.parse('_site/sitemap_google.xml').getroot()
          for entry in google.findall('s:url', ns):
              url = entry.find('s:loc', ns).text
              key = url.removeprefix(base) or 'index.html'
              lastmod = entry.find('s:lastmod', ns)
              assert lastmod is not None and lastmod.text == dates[key]
              datetime.date.fromisoformat(lastmod.text)
          assert not Path('sitemap.xml').exists(), 'Do not shadow plugin-generated sitemap.xml'
          for name in ('BingSiteAuth.xml', 'google5d93088e5855540d.html'):
              assert Path('_site', name).read_bytes() == Path(name).read_bytes()
          print('Plugin and custom sitemaps valid; all articles covered; verification files preserved.')
          PY
