name: Check sitemaps

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build with GitHub Pages Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Validate generated XML and article coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import datetime
          import json
          import xml.etree.ElementTree as ET

          ns = {'s': 'http://www.sitemaps.org/schemas/sitemap/0.9'}
          base = 'https://yusuke8696.github.io/'

          expected = {base} | {
              base + p.as_posix()
              for p in Path('articles').rglob('*.html')
          }

          # 各サイトマップを検証
          for name in (
              'sitemap.xml',
              'sitemap_google.xml',
              'sitemap_bing.xml',
          ):
              root = ET.parse(Path('_site') / name).getroot()

              assert root.tag == '{%s}urlset' % ns['s']

              urls = [
                  loc.text
                  for loc in root.findall('s:url/s:loc', ns)
              ]

              assert len(urls) == len(set(urls)), urls
              assert set(urls) == expected, (name, urls, expected)

          # Google用 sitemap の lastmod を検証
          dates = json.loads(
              Path('_data/sitemap_dates.json').read_text()
          )

          google = ET.parse(
              '_site/sitemap_google.xml'
          ).getroot()

          for entry in google.findall('s:url', ns):
              url = entry.find('s:loc', ns).text
              key = url.removeprefix(base) or 'index.html'

              lastmod = entry.find('s:lastmod', ns)

              assert (
                  lastmod is not None
                  and lastmod.text == dates[key]
              )

              datetime.date.fromisoformat(lastmod.text)

          # sitemap.xml がルートに生成されていることを確認
          assert Path('_site/sitemap.xml').exists(), \
              'sitemap.xml must be published at site root'

          # robots.txt がルートの sitemap.xml を参照していることを確認
          assert (
              Path('_site/robots.txt').read_text().strip()
              == 'Sitemap: ' + base + 'sitemap.xml'
          )

          # Search Console / Bing の認証ファイルを確認
          for name in (
              'BingSiteAuth.xml',
              'google5d93088e5855540d.html',
          ):
              assert (
                  Path('_site', name).read_bytes()
                  == Path(name).read_bytes()
              )

          print(
              'Sitemaps valid; all articles covered; '
              'verification files preserved.'
          )
          PY

      - name: Validate homepage article links
        run: python3 .github/scripts/check-article-links.py

      - name: Add temporary articles to verify automatic discovery
        run: |
          cat > articles/ci-new-article.html <<'EOF'
          ---
          layout: null
          title: "CI & 新着記事"
          published_date: "2099-01-01"
          ---
          <!doctype html><html lang="ja"><title>CI article</title><p>Temporary test article</p></html>
          EOF

          echo '<!doctype html><html><title>Plain article</title></html>' \
            > articles/ci-plain-article.html

      - name: Rebuild with temporary articles
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Verify new articles appear without editing the homepage
        run: python3 .github/scripts/check-article-links.py
