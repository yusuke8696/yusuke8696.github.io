name: 記事作成依頼
description: 確認済みのテーマから記事の下書きPRを作成します。
title: "記事案: "
body:
  - type: markdown
    attributes:
      value: |
        内容を確認してから、このIssueに `article-approved` ラベルを付けてください。
        ラベルを付けるまでは記事・PRは作成されません。
  - type: input
    id: reader
    attributes:
      label: 想定読者
      placeholder: 例: ローカルAIを初めて試すWindowsユーザー
    validations:
      required: true
  - type: textarea
    id: outline
    attributes:
      label: 記事に入れたい要点
      description: 3〜5点を目安に、事実として書いてよい内容だけを入力してください。
      placeholder: |
        - 要点1
        - 要点2
        - 要点3
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: 根拠・公式ソース
      description: 仕様、価格、手順などの事実を扱う場合は公式URLを入力してください。
  - type: textarea
    id: affiliate_links
    attributes:
      label: 使用を許可するアフィリエイトリンク
      description: 必要な場合のみ、正確なリンクを入力してください。空欄ならリンクは追加しません。
  - type: checkboxes
    id: confirmations
    attributes:
      label: 確認
      options:
        - label: 入力内容は公開してよく、個人情報・秘密情報を含みません。
          required: true
        - label: 実体験、口コミ、価格、収益、ランキングなどを根拠なく作成しないことを理解しています。
          required: true
